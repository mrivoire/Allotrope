<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Roue Allotrope - Jeu 100% gagnant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 18px;
      box-sizing: border-box;
    }

    .container {
      background: #181818;
      border-radius: 22px;
      padding: 22px 18px 18px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0,0,0,.55);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 1.8rem;
      font-weight: 750;
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 24px solid #f5c242;
      margin: 8px auto 10px;
    }

    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 50%;
      background: #111;
    }

    button {
      margin-top: 16px;
      padding: 16px;
      width: 100%;
      border-radius: 999px;
      border: none;
      font-weight: 700;
      background: #f5c242;
      color: #111;
      cursor: pointer;
      font-size: 1.05rem;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ✅ Texte du gain sous la roue */
    #gainText {
      margin: 16px 0 0;
      font-size: 1.05rem;
      font-weight: 650;
      color: #f5c242;
      display: none; /* caché tant qu'on n'a pas gagné */
      line-height: 1.35;
    }

    #gainText strong {
      color: #fff;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Roue 100% gagnante</h1>

    <div class="pointer"></div>
    <canvas id="wheel" width="320" height="320"></canvas>

    <!-- ✅ Texte du gain ici -->
    <p id="gainText"></p>

    <button id="spinBtn" type="button">Lancer la roue</button>
  </div>

<script>
/* =============================
   CONFIG
============================= */
const CONSIGNES_URL = "consignes.html";

const wheel = document.getElementById("wheel");
const ctx = wheel.getContext("2d");
const spinBtn = document.getElementById("spinBtn");
const gainText = document.getElementById("gainText");

const prizes = [
  "Shot offert",
  "Tiramisu",
  "Panna cotta",
  "Cocktail du moment",
  "Verre de vin",
  "Bière 25cl",
  "-10% sur la note"
];

const colors = ["#a67bb0", "#f5c242", "#f28e2b", "#e15759", "#8fbfbf", "#6aa25c", "#f2d36a"];
const slice = (2 * Math.PI) / prizes.length;

let angle = 0;
let spinning = false;

/* =============================
   DESSIN ROUE
============================= */
function draw() {
  const w = wheel.width;
  const h = wheel.height;
  const r = w / 2;

  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(r, r);
  ctx.rotate(angle);

  for (let i = 0; i < prizes.length; i++) {
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r, i*slice, (i+1)*slice);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.rotate(i*slice + slice/2);
    ctx.translate(r * 0.62, 0);
    ctx.rotate(Math.PI/2);
    ctx.fillStyle = "#111";
    ctx.font = "700 14px system-ui";
    const text = prizes[i];
    ctx.fillText(text, -ctx.measureText(text).width/2, 0);
    ctx.restore();
  }

  ctx.restore();
}

draw();

/* =============================
   SPIN + AFFICHAGE TEXTE
============================= */
spinBtn.addEventListener("click", () => {
  if (spinning) return;

  // 1er clic sans avis => consignes (comme tu le veux)
  if (!localStorage.getItem("avisValide")) {
    window.location.href = CONSIGNES_URL;
    return;
  }

  // Après avis => jeu
  localStorage.removeItem("avisValide"); // 1 avis = 1 partie
  spinning = true;
  spinBtn.disabled = true;

  // cache le texte du gain si un ancien gain existe
  gainText.style.display = "none";
  gainText.textContent = "";

  // 🎯 On choisit le gain et on calcule l'angle d'arrêt
  const winningIndex = Math.floor(Math.random() * prizes.length);
  const winningPrize = prizes[winningIndex];

  const extraTurns = 6;
  const targetAngle =
    extraTurns * 2 * Math.PI +
    (3 * Math.PI) / 2 -
    (winningIndex * slice + slice / 2);

  const startAngle = angle;
  const delta = targetAngle - startAngle;

  const start = performance.now();
  const duration = 4200;

  function animate(t) {
    const p = Math.min((t - start) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    angle = startAngle + delta * eased;
    draw();

    if (p < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      spinBtn.disabled = false;

      // ✅ Texte exact demandé, sous la roue
      gainText.innerHTML =
        'Félicitations, vous avez gagné : <strong>' + winningPrize + '</strong>';

      gainText.style.display = "block";
    }
  }

  requestAnimationFrame(animate);
});
</script>
</body>
</html>
