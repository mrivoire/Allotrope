<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Roue Allotrope - Jeu 100% gagnant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #181818;
      border-radius: 18px;
      padding: 20px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 50%;
    }
    .pointer {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 24px solid #f5c242;
      margin: 10px auto;
    }
    button {
      margin-top: 14px;
      padding: 14px;
      width: 100%;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      background: #f5c242;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div class="container">
  <h2>Roue 100% gagnante</h2>

  <div class="pointer"></div>
  <canvas id="wheel" width="300" height="300"></canvas>

  <button id="spinBtn">Lancer la roue</button>
</div>

<script>
/* =============================
   CONFIG
============================= */
const CONSIGNES_URL = "consignes.html";
const wheel = document.getElementById("wheel");
const ctx = wheel.getContext("2d");
const spinBtn = document.getElementById("spinBtn");

const prizes = [
  "Tiramisu",
  "Panna cotta",
  "Cocktail du moment",
  "Verre de vin",
  "Bière 25cl",
  "-10% sur la note",
  "Shot offert"
];

const colors = ["#f5c242","#f28e2b","#e15759","#76b7b2","#59a14f","#edc948","#af7aa1"];
const slice = (2 * Math.PI) / prizes.length;

let angle = 0;
let spinning = false;

/* =============================
   DESSIN ROUE
============================= */
function draw() {
  ctx.clearRect(0,0,300,300);
  ctx.save();
  ctx.translate(150,150);
  ctx.rotate(angle);

  for (let i = 0; i < prizes.length; i++) {
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,150,i*slice,(i+1)*slice);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.stroke();

    ctx.save();
    ctx.rotate(i*slice + slice/2);
    ctx.translate(90,0);
    ctx.rotate(Math.PI/2);
    ctx.fillStyle = "#111";
    ctx.font = "bold 12px system-ui";
    ctx.fillText(prizes[i], -ctx.measureText(prizes[i]).width/2, 0);
    ctx.restore();
  }
  ctx.restore();
}

draw();

/* =============================
   SPIN LOGIC
============================= */
spinBtn.onclick = () => {
  if (spinning) return;

  // 🔁 AVANT AVIS → consignes
  if (!localStorage.getItem("avisValide")) {
    window.location.href = CONSIGNES_URL;
    return;
  }

  // ✅ APRÈS AVIS → JEU
  localStorage.removeItem("avisValide");
  spinning = true;

  const target = Math.random() * 10 + 10;
  const start = performance.now();
  const duration = 4000;

  function animate(t) {
    const p = Math.min((t - start) / duration, 1);
    angle = target * (1 - Math.pow(1 - p, 3));
    draw();

    if (p < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      alert("🎉 Présente ton écran au staff pour récupérer ton gain !");
    }
  }

  requestAnimationFrame(animate);
};
</script>
</body>
</html>
