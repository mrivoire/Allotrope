<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Roue Allotrope - Jeu 100% gagnant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f8f8f8;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      width: 100%;
      padding: 16px;
      text-align: center;
      background: #181818;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
    h2 {
      font-size: 0.9rem;
      font-weight: 400;
      margin-top: 0;
      margin-bottom: 1rem;
      color: #f5c242;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #wheelCanvas {
      display: block;
      margin: 0 auto;
      background: #111;
      border-radius: 50%;
    }
    .pointer {
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-bottom: 26px solid #f5c242;
      margin: 12px auto 4px;
    }
    button {
      margin-top: 12px;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #f5c242;
      color: #111;
      font-weight: 600;
      box-shadow: 0 6px 16px rgba(245, 194, 66, 0.5);
    }
    .details {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #aaa;
      line-height: 1.4;
    }
    .highlight { color: #f5c242; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Allotrope</h1>
    <h2>Roue 100% gagnante</h2>

    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="320" height="320"></canvas>

    <button id="spinBtn">Lancer la roue</button>

    <div class="details">
      Clique sur <span class="highlight">Lancer la roue</span> pour découvrir ton gain 🎁
    </div>
  </div>

<script>
/* ===============================
   🎨 DESSIN DE LA ROUE (inchangé)
   =============================== */
const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");
const size = canvas.width;
const radius = size / 2;

const prizes = [
  "Tiramisu", "Panna cotta", "Cocktail du moment",
  "Verre de vin 12 cl", "Bière 25 cl", "-10% sur la note", "Un shot offert"
];

const colors = [
  "#f5c242","#f28e2b","#e15759",
  "#76b7b2","#59a14f","#edc948","#af7aa1"
];

const sliceAngle = (2 * Math.PI) / prizes.length;
let currentAngle = 0;
let isSpinning = false;

function drawWheel(angle = 0) {
  ctx.clearRect(0,0,size,size);
  ctx.save();
  ctx.translate(radius, radius);
  ctx.rotate(angle);

  for (let i = 0; i < prizes.length; i++) {
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,radius-4,i*sliceAngle,(i+1)*sliceAngle);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.fillStyle = "#111";
    ctx.font = "bold 13px system-ui, sans-serif";
    ctx.rotate(i*sliceAngle + sliceAngle/2);
    ctx.translate(radius*0.68,0);
    ctx.rotate(Math.PI/2);
    const text = prizes[i];
    ctx.fillText(text, -ctx.measureText(text).width/2, 0);
    ctx.restore();
  }
  ctx.restore();
}

drawWheel();

/* ===============================
   🎰 LANCEMENT DE LA ROUE (FIX)
   =============================== */
document.getElementById("spinBtn").addEventListener("click", () => {
  if (isSpinning) return;

  // 🔐 CONTRÔLE ICI UNIQUEMENT
  if (!localStorage.getItem("avisValide")) {
    alert("Merci de laisser un avis avant de jouer.");
    window.location.href = "avis.html";
    return;
  }

  // ⛔ Consomme le droit de jouer
  localStorage.removeItem("avisValide");

  isSpinning = true;
  const targetRotation = (Math.random() * 5 + 5) * 2 * Math.PI;
  const start = performance.now();
  const duration = 4000;

  function animate(time) {
    const progress = Math.min((time - start) / duration, 1);
    const easeOut = 1 - Math.pow(1 - progress, 3);
    currentAngle = easeOut * targetRotation;
    drawWheel(currentAngle);

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      isSpinning = false;
      alert("🎉 Félicitations ! Montre cet écran au staff pour récupérer ton gain.");
    }
  }

  requestAnimationFrame(animate);
});
</script>
</body>
</html>
