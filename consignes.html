<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Jouer - Allotrope</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffc800;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
      max-width: 420px;
      width: 90%;
      padding: 24px 24px 20px;
      box-sizing: border-box;
      text-align: left;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #444;
    }

    .flag { font-size: 1.4rem; }

    ol {
      margin: 0 0 20px;
      padding-left: 20px;
      color: #555;
      line-height: 1.6;
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: #1f8fff;
      color: #fff;
      box-shadow: 0 10px 24px rgba(31, 143, 255, 0.45);
      text-decoration: none;
    }

    .btn span.star { margin-right: 6px; font-size: 1.1rem; }

    .hint {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="title">Jouer</div>
      <div class="flag">🇫🇷</div>
    </div>

    <ol>
      <li>Laissez-nous votre avis (30 secondes).</li>
      <li>Revenez à cette page.</li>
      <li>Jouez pour gagner un cadeau chez Allotrope 🎁</li>
    </ol>

    <button class="btn" id="btnAvis">
      <span class="star">⭐</span> Avis
    </button>

    <div class="hint">
      Votre avis nous aide beaucoup. Merci 🙏
    </div>
  </div>

  <script>
    // URL de la page avis (smileys)
    const AVIS_URL = "https://mrivoire.github.io/Allotrope/avis-allotrope.html";

    document.getElementById("btnAvis").addEventListener("click", () => {
      window.location.href = AVIS_URL;
    });
  </script>
</body>
</html>
