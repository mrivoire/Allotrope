<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Votre avis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: #181818;
      border-radius: 22px;
      padding: 26px 24px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(0,0,0,.65);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      margin-bottom: 12px;
    }

    .smileys {
      display: flex;
      justify-content: space-between;
      margin: 22px 0 18px;
      padding: 0 8px;
    }

    .smiley-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.45;
      transition: transform .12s ease, opacity .12s ease;
    }

    .smiley-wrap.selected {
      opacity: 1;
      transform: scale(1.2);
    }

    .smiley-wrap.bad {
      background: #d9534f;
    }

    .smiley-wrap.medium {
      background: #f0ad4e; /* JAUNE */
    }

    .smiley-wrap.good {
      background: #5cb85c;
    }

    .smiley {
      font-size: 2rem;
    }

    textarea {
      width: 100%;
      min-height: 92px;
      border-radius: 12px;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      margin-bottom: 14px;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #f5c242;
      color: #111;
      box-shadow: 0 6px 18px rgba(245, 194, 66, 0.5);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Votre avis compte</h1>

    <div class="smileys">
      <div class="smiley-wrap bad" data-type="bad">
        <span class="smiley">😡</span>
      </div>
      <div class="smiley-wrap medium" data-type="medium">
        <span class="smiley">😐</span>
      </div>
      <div class="smiley-wrap good" data-type="good">
        <span class="smiley">😀</span>
      </div>
    </div>

    <textarea
      id="message"
      placeholder="Dites-nous ce que vous en pensez..."
      required
    ></textarea>

    <button id="sendBtn">Envoyer mon avis</button>
  </div>

  <script>
  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxL_4FCgURHX5C5Wc2ORvrN_sjsE9Uh89MexRkD2GtJZ58gy7jPXu_PMl-teOfr3AFczw/exec";

  const GOOGLE_REVIEW_URL =
    "https://g.page/r/CUGrJ6V4TpTjEAE/review";

  const ROULETTE_URL = "index.html";

  let selectedType = null;

  const wraps = document.querySelectorAll(".smiley-wrap");
  const message = document.getElementById("message");
  const sendBtn = document.getElementById("sendBtn");

  // Sélection du smiley
  wraps.forEach(wrap => {
    wrap.addEventListener("click", () => {
      wraps.forEach(w => w.classList.remove("selected"));
      wrap.classList.add("selected");
      selectedType = wrap.dataset.type;
    });
  });

  // Envoi de l'avis
  sendBtn.addEventListener("click", () => {
    if (!selectedType) {
      alert("Merci de sélectionner un smiley.");
      return;
    }

    // 😀 → Google Avis
    if (selectedType === "good") {
      window.location.href = GOOGLE_REVIEW_URL;
      return;
    }

    // 😡 / 😐 → avis interne
    if (!message.value.trim()) {
      alert("Merci de laisser un message.");
      return;
    }

    // Envoi silencieux (CORS safe)
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        ressenti:
          selectedType === "bad"
            ? "Pas content"
            : "Moyennement content",
        message: message.value
      })
    });

    // Confirmation utilisateur
    alert("Merci pour votre retour 🙏");

    // Redirection vers la roulette
    window.location.href = ROULETTE_URL;
  });
</script>
</body>
</html>
