<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Votre avis compte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 18px;
    }
    .box {
      background: #181818;
      border-radius: 20px;
      padding: 22px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h2 { margin-top: 0; }
    .smileys {
      display: flex;
      justify-content: space-between;
      margin: 18px 0;
      font-size: 2.2rem;
    }
    .smiley {
      cursor: pointer;
      opacity: .4;
      transition: transform .15s ease, opacity .15s ease;
    }
    .smiley.selected {
      opacity: 1;
      transform: scale(1.2);
    }
    textarea {
      width: 100%;
      border-radius: 14px;
      border: none;
      padding: 12px;
      margin-top: 10px;
      min-height: 80px;
      font-family: inherit;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border-radius: 999px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    #sendBtn { background: #f5c242; }
    #playBtn {
      background: #6fdc8c;
      display: none;
    }
  </style>
</head>

<body>
<div class="box">
  <h2>Votre avis compte</h2>

  <div class="smileys">
    <div class="smiley" data-type="bad">😡</div>
    <div class="smiley" data-type="medium">😐</div>
    <div class="smiley" data-type="good">😀</div>
  </div>

  <textarea id="msg" placeholder="Votre message (facultatif pour Google)"></textarea>

  <button id="sendBtn">Envoyer mon avis</button>
  <button id="playBtn">🎁 J’ai laissé mon avis – Jouer</button>
</div>

<script>
const GOOGLE_REVIEW_URL = "https://g.page/r/CUGrJ6V4TpTjEAE/review";

let selected = null;

document.querySelectorAll(".smiley").forEach(s => {
  s.onclick = () => {
    document.querySelectorAll(".smiley").forEach(x => x.classList.remove("selected"));
    s.classList.add("selected");
    selected = s.dataset.type;
  };
});

document.getElementById("sendBtn").onclick = () => {
  if (!selected) {
    alert("Merci de choisir un smiley.");
    return;
  }

  // 😀 → Google Avis
  if (selected === "good") {
    window.open(GOOGLE_REVIEW_URL, "_blank");
  }

  // 😡 / 😐 → ton envoi interne (inchangé chez toi)
  // (si tu as un fetch Google Script ici, tu le laisses)

  // 👉 Affiche le bouton de confirmation
  document.getElementById("playBtn").style.display = "block";
  document.getElementById("sendBtn").disabled = true;
};

document.getElementById("playBtn").onclick = () => {
  // 🔐 Déblocage officiel du jeu
  localStorage.setItem("avisValide", "1");
  window.location.href = "index.html";
};
</script>
</body>
</html>
