<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Votre avis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #181818;
      border-radius: 22px;
      padding: 26px 24px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(0,0,0,.65);
    }
    .smileys {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
    }
    .smiley-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.4;
      transition: transform .15s, opacity .15s;
    }
    .smiley-wrap.selected {
      opacity: 1;
      transform: scale(1.2);
    }
    .bad { background: #d9534f; }
    .medium { background: #f0ad4e; }
    .good { background: #5cb85c; }
    textarea {
      width: 100%;
      min-height: 90px;
      border-radius: 12px;
      border: none;
      padding: 12px;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: #f5c242;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Votre avis compte</h2>

    <div class="smileys">
      <div class="smiley-wrap bad" data-type="bad">😡</div>
      <div class="smiley-wrap medium" data-type="medium">😐</div>
      <div class="smiley-wrap good" data-type="good">😀</div>
    </div>

    <textarea id="message" placeholder="Votre message..."></textarea>
    <button type="button" id="sendBtn">Valider mon avis</button>
  </div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxL_4FCgURHX5C5Wc2ORvrN_sjsE9Uh89MexRkD2GtJZ58gy7jPXu_PMl-teOfr3AFczw/exec";
const GOOGLE_REVIEW_URL = "https://g.page/r/CUGrJ6V4TpTjEAE/review";
const ROULETTE_URL = "index.html";

let selectedType = null;
const wraps = document.querySelectorAll(".smiley-wrap");
const message = document.getElementById("message");

wraps.forEach(wrap => {
  wrap.addEventListener("click", () => {
    wraps.forEach(w => w.classList.remove("selected"));
    wrap.classList.add("selected");
    selectedType = wrap.dataset.type;
  });
});

document.getElementById("sendBtn").addEventListener("click", () => {
  if (!selectedType) {
    alert("Merci de sélectionner un smiley.");
    return;
  }

  // 😀 Google Avis
  if (selectedType === "good") {
    localStorage.setItem("avisGoogleEnCours", "1");
    window.location.href = GOOGLE_REVIEW_URL;
    return;
  }

  // 😡 / 😐 avis interne
  if (!message.value.trim()) {
    alert("Merci de laisser un message.");
    return;
  }

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      ressenti: selectedType === "bad" ? "Pas content" : "Moyen",
      message: message.value
    })
  });

  localStorage.setItem("avisValide", "1");
  window.location.href = ROULETTE_URL;
});

// 🔄 Retour depuis Google Avis
if (localStorage.getItem("avisGoogleEnCours")) {
  localStorage.removeItem("avisGoogleEnCours");
  localStorage.setItem("avisValide", "1");
  window.location.href = ROULETTE_URL;
}
</script>
</body>
</html>
