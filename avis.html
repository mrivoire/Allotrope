<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Votre avis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: #181818;
      border-radius: 22px;
      padding: 26px 24px 24px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(0,0,0,.65);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .smileys {
      display: flex;
      justify-content: space-between;
      margin: 22px 0 18px;
      padding: 0 8px;
    }

    .smiley {
      font-size: 2.8rem;
      cursor: pointer;
      opacity: 0.45;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .smiley.bad {
      filter: hue-rotate(330deg) saturate(2);
    }

    .smiley.medium {
      filter: hue-rotate(40deg) saturate(1.8);
    }

    .smiley.good {
      filter: hue-rotate(95deg) saturate(1.8);
    }

    .smiley.selected {
      opacity: 1;
      transform: scale(1.22);
    }

    textarea {
      width: 100%;
      min-height: 92px;
      border-radius: 12px;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      margin-bottom: 14px;
      resize: vertical;
      box-sizing: border-box;
      background: #f4f4f4;
      color: #111;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #f5c242;
      color: #111;
      box-shadow: 0 6px 18px rgba(245, 194, 66, 0.5);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Votre avis compte</h1>

    <div class="smileys">
      <span class="smiley bad" data-type="bad">😡</span>
      <span class="smiley medium" data-type="medium">😐</span>
      <span class="smiley good" data-type="good">😀</span>
    </div>

    <!-- Envoi email pour 😡 / 😐 -->
    <form
      id="avisForm"
      action="https://formspree.io/f/xjvqqlgp"
      method="POST"
    >
      <input type="hidden" name="ressenti" id="ressenti" />

      <textarea
        name="message"
        placeholder="Dites-nous ce que vous en pensez..."
        required
      ></textarea>

      <button type="submit">Envoyer mon avis</button>
    </form>
  </div>

  <script>
    let selectedType = null;
    const smileys = document.querySelectorAll(".smiley");
    const ressentiInput = document.getElementById("ressenti");
    const form = document.getElementById("avisForm");

    smileys.forEach(smiley => {
      smiley.addEventListener("click", () => {
        smileys.forEach(s => s.classList.remove("selected"));
        smiley.classList.add("selected");
        selectedType = smiley.dataset.type;
        ressentiInput.value = selectedType;
      });
    });

    form.addEventListener("submit", (e) => {
      if (!selectedType) {
        e.preventDefault();
        alert("Merci de sélectionner un smiley.");
        return;
      }

      // 😀 → Google Avis
      if (selectedType === "good") {
        e.preventDefault();
        window.location.href = "https://g.page/r/CUGrJ6V4TpTjEAE/review";
      }
      // 😡 / 😐 → Formspree → email pierrejahjahoueis@gmail.com
    });
  </script>
</body>
</html>
