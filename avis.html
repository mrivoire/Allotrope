<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Votre avis compte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 18px;
    }
    .box {
      background: #181818;
      border-radius: 20px;
      padding: 22px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h2 { margin-top: 0; }
    .smileys {
      display: flex;
      justify-content: space-between;
      margin: 18px 0;
      font-size: 2.2rem;
    }
    .smiley {
      cursor: pointer;
      opacity: .4;
      transition: transform .15s ease, opacity .15s ease;
    }
    .smiley.selected {
      opacity: 1;
      transform: scale(1.2);
    }
    textarea {
      width: 100%;
      border-radius: 14px;
      border: none;
      padding: 12px;
      margin-top: 10px;
      min-height: 80px;
      font-family: inherit;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border-radius: 999px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    #sendBtn { background: #f5c242; }
    #playBtn {
      background: #6fdc8c;
      display: none;
    }
    .hint {
      margin-top: 10px;
      color: #bbb;
      font-size: .9rem;
      line-height: 1.3;
      display: none;
    }
  </style>
</head>

<body>
<div class="box">
  <h2>Votre avis compte</h2>

  <div class="smileys">
    <div class="smiley" data-type="bad">😡</div>
    <div class="smiley" data-type="medium">😐</div>
    <div class="smiley" data-type="good">😀</div>
  </div>

  <textarea id="msg" placeholder="Votre message (facultatif pour Google)"></textarea>

  <button id="sendBtn">Valider mon avis</button>
  <button id="playBtn">🎁 J’ai laissé mon avis – Débloquer le jeu</button>

  <div id="hint" class="hint">
    Google Avis s’ouvre dans un autre onglet. Revenez ici puis cliquez sur “Débloquer le jeu”.
  </div>
</div>

<script>
  const GOOGLE_REVIEW_URL = "https://g.page/r/CUGrJ6V4TpTjEAE/review";
  const sendBtn = document.getElementById("sendBtn");
  const playBtn = document.getElementById("playBtn");
  const hint = document.getElementById("hint");

  let selected = null;

  function showPlayButton() {
    playBtn.style.display = "block";
    sendBtn.style.display = "none";
    hint.style.display = "block";
  }

  // ✅ Important : se déclenche aussi quand on revient en arrière (Safari/iOS)
  function restoreStateIfNeeded() {
    if (localStorage.getItem("googleAvisOuvert") === "1") {
      showPlayButton();
    }
  }

  // Sélection smiley
  document.querySelectorAll(".smiley").forEach(s => {
    s.addEventListener("click", () => {
      document.querySelectorAll(".smiley").forEach(x => x.classList.remove("selected"));
      s.classList.add("selected");
      selected = s.dataset.type;
    });
  });

  // Chargement normal
  restoreStateIfNeeded();

  // Retour arrière / bfcache
  window.addEventListener("pageshow", restoreStateIfNeeded);

  // Valider
  sendBtn.addEventListener("click", () => {
    if (!selected) {
      alert("Merci de choisir un smiley.");
      return;
    }

    // 😀 → Google Avis
    if (selected === "good") {
      localStorage.setItem("googleAvisOuvert", "1");
      // IMPORTANT : ouvrir Google dans un nouvel onglet
      window.open(GOOGLE_REVIEW_URL, "_blank");
      // Et on affiche tout de suite le bouton de déblocage
      showPlayButton();
      return;
    }

    // 😡 / 😐 : si tu as ton fetch d’envoi interne, il reste ici
    // fetch(...)

    // Pour 😡 / 😐 : on peut débloquer directement
    localStorage.setItem("avisValide", "1");
    window.location.href = "index.html";
  });

  // Débloquer le jeu après Google
  playBtn.addEventListener("click", () => {
    localStorage.removeItem("googleAvisOuvert");
    localStorage.setItem("avisValide", "1");
    window.location.href = "index.html";
  });
</script>
</body>
</html>
