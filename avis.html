<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Votre avis compte</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background:#111;
  color:#fff;
  font-family:system-ui,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  margin:0;
  padding:18px;
}

.box {
  background:#181818;
  border-radius:22px;
  padding:22px;
  max-width:420px;
  width:100%;
  text-align:center;
}

.smileys {
  display:flex;
  justify-content:space-between;
  margin:18px 0;
  font-size:2.3rem;
}

.smiley {
  background:none;
  border:none;
  cursor:pointer;
  opacity:.4;
  transition:.15s;
  font-size:2.3rem;
}

.smiley.selected {
  opacity:1;
  transform:scale(1.2);
}

textarea {
  width:100%;
  border-radius:14px;
  border:none;
  padding:12px;
  min-height:80px;
}

button#sendBtn {
  width:100%;
  margin-top:14px;
  padding:14px;
  border-radius:999px;
  border:none;
  font-weight:700;
  background:#f5c242;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="box">
  <h2>Votre avis compte</h2>

  <div class="smileys">
    <button class="smiley" data-type="bad">😡</button>
    <button class="smiley" data-type="medium">😐</button>
    <button class="smiley" data-type="good">😀</button>
  </div>

  <textarea id="msg" placeholder="Votre message (facultatif)"></textarea>

  <button id="sendBtn" type="button">Valider mon avis</button>
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/TON_ID/exec";
const GOOGLE_AVIS_URL = "https://g.page/r/TON_LIEN_GOOGLE/review";

let selectedType = null;
const messageInput = document.getElementById("msg");
const smileys = document.querySelectorAll(".smiley");

smileys.forEach(el => {
  el.addEventListener("click", () => {
    smileys.forEach(s => s.classList.remove("selected"));
    el.classList.add("selected");
    selectedType = el.dataset.type;
  });
});

document.getElementById("sendBtn").addEventListener("click", () => {
  if (!selectedType) {
    alert("Merci de sélectionner un smiley.");
    return;
  }

  const body = new URLSearchParams();
  body.append(
    "ressenti",
    selectedType === "bad"
      ? "Pas content"
      : selectedType === "medium"
      ? "Moyennement content"
      : "Content"
  );
  body.append("message", messageInput.value || "");

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: body
  });

  localStorage.setItem("avisValide", "1");

  if (selectedType === "good") {
    window.open(GOOGLE_AVIS_URL, "_blank");
  }

  window.location.href = "index.html";
});
</script>
</body>
</html>
