<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Votre avis compte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background:#111;
      color:#fff;
      font-family:system-ui,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      margin:0;
      padding:18px;
    }
    .box {
      background:#181818;
      border-radius:22px;
      padding:22px;
      max-width:420px;
      width:100%;
      text-align:center;
    }
    h2 {margin-top:0;}
    .smileys {
      display:flex;
      justify-content:space-between;
      margin:18px 0;
      font-size:2.3rem;
    }
    .smiley {
      cursor:pointer;
      opacity:.4;
      transition:.15s;
    }
    .smiley.selected {
      opacity:1;
      transform:scale(1.2);
    }
    textarea {
      width:100%;
      border-radius:14px;
      border:none;
      padding:12px;
      margin-top:10px;
      min-height:80px;
      font-family:inherit;
    }
    button {
      width:100%;
      margin-top:14px;
      padding:14px;
      border-radius:999px;
      border:none;
      font-weight:700;
      cursor:pointer;
    }
    #sendBtn {background:#f5c242;}
    #playBtn {background:#6fdc8c; display:none;}
    .hint {
      margin-top:10px;
      font-size:.9rem;
      color:#bbb;
      display:none;
      line-height:1.3;
    }
  </style>
</head>

<body>
<div class="box">
  <h2>Votre avis compte</h2>

  <div class="smileys">
    <div class="smiley" data-type="bad">😡</div>
    <div class="smiley" data-type="medium">😐</div>
    <div class="smiley" data-type="good">😀</div>
  </div>

  <textarea id="msg" placeholder="Votre message (facultatif)"></textarea>

  <button id="sendBtn" type="button">Valider mon avis</button>
  <button id="playBtn" type="button">🎁 J’ai laissé mon avis – Débloquer le jeu</button>

  <div id="hint" class="hint">
    Google Avis s’ouvre dans un autre onglet.<br>
    Revenez ici puis cliquez sur “Débloquer le jeu”.
  </div>
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/TON_ID/exec";
const GOOGLE_AVIS_URL = "https://g.page/r/TON_LIEN_GOOGLE/review";

let selectedType = null;
const messageInput = document.getElementById("message");

/* Sélection smiley (DESKTOP + IPHONE) */
function selectSmiley(el) {
  document.querySelectorAll(".smiley-wrap").forEach(s => s.classList.remove("selected"));
  el.classList.add("selected");
  selectedType = el.dataset.type;
}

document.querySelectorAll(".smiley-wrap").forEach(el => {
  // Desktop
  el.addEventListener("click", () => selectSmiley(el));

  // iPhone / Safari
  el.addEventListener("touchstart", e => {
    e.preventDefault();
    selectSmiley(el);
  }, { passive: false });
});

/* Envoi avis */
document.getElementById("sendBtn").addEventListener("click", () => {
  if (!selectedType) {
    alert("Merci de sélectionner un smiley.");
    return;
  }

  if (!messageInput.value.trim()) {
    alert("Merci de laisser un message.");
    return;
  }

  const body = new URLSearchParams();
  body.append(
    "ressenti",
    selectedType === "bad"
      ? "Pas content"
      : selectedType === "neutral"
      ? "Moyennement content"
      : "Content"
  );
  body.append("message", messageInput.value);

  // POST fiable vers Google Apps Script
  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: body
  });

  // Débloque le jeu
  localStorage.setItem("avisValide", "1");

  // Google Avis si smiley positif
  if (selectedType === "good") {
    window.open(GOOGLE_AVIS_URL, "_blank");
  }

  // Retour au jeu
  window.location.href = "index.html";
});
</script>
</body>
</html>
